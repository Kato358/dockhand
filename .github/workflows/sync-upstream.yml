name: Sync upstream

# 工作流 1/3：把上游 Finsys/dockhand 合并进本仓库 main 分支。
# main 始终保持为"上游镜像 + 少量本仓库自有文件（工作流、l10n 词典）"，
# 汉化结果只存在于 localized 分支，因此合并永远不会和翻译冲突。
# 成功推进 main 后通过 workflow_dispatch 触发工作流 2（汉化）。

on:
  schedule:
    - cron: '0 21 * * *' # 每日 UTC 21:00（北京时间次日 05:00）
  workflow_dispatch:
    inputs:
      force:
        description: '没有上游新提交时也继续触发后续流程'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: https://github.com/Finsys/dockhand.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.merge.outputs.synced }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Merge upstream into main
        id: merge
        env:
          FORCE: ${{ inputs.force }}
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/"$UPSTREAM_BRANCH")
          echo "main 落后上游 $BEHIND 个提交"

          if [ "$BEHIND" -eq 0 ] && [ "$FORCE" != "true" ]; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "已与上游一致，无事可做。"
            exit 0
          fi

          if git merge --no-edit upstream/"$UPSTREAM_BRANCH"; then
            git push origin HEAD:"$GITHUB_REF_NAME" 2>/dev/null || git push origin HEAD
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::合并上游时产生冲突。请本地执行：git remote add upstream $UPSTREAM_REPO && git fetch upstream && git merge upstream/$UPSTREAM_BRANCH，解决冲突后推送。"
            git merge --abort || true
            exit 1
          fi

      - name: Trigger localize workflow
        if: steps.merge.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库里存在 upstream remote 时，gh 会错误地解析到上游仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run localize.yml --ref main -f synced_from="${GITHUB_SHA::7}"
          echo "已触发工作流 2（汉化）"
